<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027">
        <animate attributeName="stop-color" values="#0f2027;#203a43;#2c5364;#0f2027" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#203a43">
        <animate attributeName="stop-color" values="#203a43;#2c5364;#0f2027;#203a43" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#2c5364">
        <animate attributeName="stop-color" values="#2c5364;#0f2027;#203a43;#2c5364" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#bgGrad)"/>

  <!-- subtle floating wave shapes -->
  <path d="M0,180 Q300,140 600,180 T1200,180 V220 H0 Z" fill="#ffffff" opacity="0.05">
    <animate attributeName="d"
      values="M0,180 Q300,140 600,180 T1200,180 V220 H0 Z;
              M0,190 Q300,160 600,190 T1200,190 V220 H0 Z;
              M0,180 Q300,140 600,180 T1200,180 V220 H0 Z"
      dur="6s" repeatCount="indefinite"/>
  </path>
  <path d="M0,200 Q300,170 600,200 T1200,200 V220 H0 Z" fill="#ffffff" opacity="0.08">
    <animate attributeName="d"
      values="M0,200 Q300,170 600,200 T1200,200 V220 H0 Z;
              M0,205 Q300,185 600,205 T1200,205 V220 H0 Z;
              M0,200 Q300,170 600,200 T1200,200 V220 H0 Z"
      dur="4s" repeatCount="indefinite"/>
  </path>

  <text x="600" y="95" font-family="Segoe UI, Verdana, sans-serif" font-size="42"
        font-weight="600" fill="#ffffff" text-anchor="middle" opacity="0">
    Mohammad Saad Mubeen Shaikh
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>

  <text x="600" y="135" font-family="Segoe UI, Verdana, sans-serif" font-size="18"
        fill="#c9d6df" text-anchor="middle" opacity="0">
    Computer Science Undergrad | Java &amp; DSA | ML Enthusiast
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.4s" fill="freeze"/>
  </text>
</svg>
